name: Validate LEADORA

on:
  # Cloudflare builds and deploys main independently. Keep this validation
  # available for an intentional manual run without blocking deployments when
  # GitHub Actions billing is unavailable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
